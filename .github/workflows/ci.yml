name: ci

on:
  pull_request:
  push:
    branches: [main, develop, 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Placeholders only. The build validates that these exist but never contacts
# Supabase, so CI needs no real project or secret.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-real
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  # Production dependencies only. Reported on every run; whether it blocks a
  # merge is decided by the branch ruleset (required once v1.0.1 is released).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=critical

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: No committed env files
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env' | grep -v -x '.env.example' || true)
          if [ -n "$tracked" ]; then echo "Tracked env files:"; echo "$tracked"; exit 1; fi
      - name: No secret-looking values
        run: |
          if git grep -nIE \
            -e 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' \
            -e 'sk_live_[0-9A-Za-z]{10,}' \
            -e 'AIza[0-9A-Za-z_-]{35}' \
            -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            -- . ':(exclude)package-lock.json'; then
            echo "Possible secret committed. Remove it and rotate the key."; exit 1
          fi

  # Applies every migration and the seed to a throwaway local Supabase database,
  # runs the SQL tests, then runs every rollback file newest-first.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - name: Start database (migrations + seed)
        run: >-
          supabase start
          -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Add a test member
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/ci_fixtures.sql
      - name: SQL tests
        run: |
          for f in supabase/tests/*.test.sql; do
            echo "::group::$f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done
      - name: Rollback files (newest first)
        run: |
          for f in $(ls supabase/rollback/*.down.sql | sort -r); do
            echo "$f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Stop database
        if: always()
        run: supabase stop --no-backup

  # Critical user journeys (CUJ-1..8) and accessibility checks in a real browser, on a
  # phone-size and a desktop-size screen. Runs against a local Supabase created for
  # this job (migrations + seed) and thrown away after it: never staging or production,
  # and no secrets. The keys used are the CLI's fixed local development keys.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - run: npm ci
      - name: Start Supabase (database, auth, API)
        run: >-
          supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Local Supabase address and keys
        run: |
          supabase status -o env | sed -n 's/^\(API_URL\|ANON_KEY\|SERVICE_ROLE_KEY\)="\(.*\)"$/E2E_\1=\2/p' \
            | sed 's/^E2E_API_URL=/E2E_SUPABASE_URL=/' >> "$GITHUB_ENV"
      - name: Build against the local Supabase
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.E2E_ANON_KEY }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
