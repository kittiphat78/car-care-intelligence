<title>คาร์แคร์ Style Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — bottom nav below 1024px, 240px sidebar at 1024px+; tokens copied 1:1 from docs/redesign/design-tokens.md (dark-first). */
:root {
  color-scheme: dark;
  --bg: #0B111A; --surface: #131B26; --surface-2: #1B2533; --surface-inverse: #F1F5F9;
  --overlay: rgb(0 0 0 / 0.6);
  --text: #F1F5F9; --text-2: #CBD5E1; --text-3: #A3B0C2; --text-inverse: #0B111A;
  --border: #2A3647; --border-strong: #6B7A90;
  --primary: #2563EB; --primary-hover: #1D4ED8; --on-primary: #FFFFFF; --primary-subtle: #16274A; --link: #8AB4FF; --focus: #8AB4FF;
  --success: #047857; --success-subtle: #0E2E24; --success-text: #4ADE9B;
  --danger: #C62828; --danger-subtle: #3A1517; --danger-text: #FF8A8A;
  --warning: #B45309; --warning-subtle: #3A2610; --warning-text: #FBBF4D;
  --info-subtle: #16274A; --info-text: #8AB4FF;
  --income: #4ADE9B; --expense: #FF8A8A; --unpaid: #FBBF4D;
  --wash: #4FC3F7; --wash-subtle: #0E2A3A; --polish: #C4A8FF; --polish-subtle: #26193F;
  --env: #B45309;
  --elev-1: none; --elev-2: 0 4px 12px rgb(0 0 0 / .5); --elev-3: 0 12px 32px rgb(0 0 0 / .6);
  --font: "Sarabun", "Noto Sans Thai", "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px;
  --dur-fast: 150ms; --dur-base: 220ms; --ease: cubic-bezier(0.2, 0, 0, 1);
  --gutter: 16px; --nav-h: 64px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #F4F6F9; --surface: #FFFFFF; --surface-2: #EDF0F4; --surface-inverse: #0F1A2A; --overlay: rgb(15 26 42 / 0.5);
    --text: #0F1A2A; --text-2: #3D4A5C; --text-3: #5A6678; --text-inverse: #FFFFFF;
    --border: #D9DFE7; --border-strong: #7B8798;
    --primary: #1D4ED8; --primary-hover: #1E40AF; --primary-subtle: #E3EBFD; --link: #1D4ED8; --focus: #1D4ED8;
    --success-subtle: #DDF5EA; --success-text: #05603F;
    --danger: #B91C1C; --danger-subtle: #FDE7E7; --danger-text: #991B1B;
    --warning-subtle: #FEF0D2; --warning-text: #8A3B05;
    --info-subtle: #E3EBFD; --info-text: #1E40AF;
    --income: #047857; --expense: #B91C1C; --unpaid: #B45309;
    --wash: #0369A1; --wash-subtle: #E0F0FA; --polish: #6D28D9; --polish-subtle: #EFE7FD;
    --elev-1: 0 1px 2px rgb(15 26 42 / .06), 0 1px 3px rgb(15 26 42 / .08); --elev-2: 0 4px 12px rgb(15 26 42 / .12); --elev-3: 0 12px 32px rgb(15 26 42 / .2);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #F4F6F9; --surface: #FFFFFF; --surface-2: #EDF0F4; --surface-inverse: #0F1A2A; --overlay: rgb(15 26 42 / 0.5);
  --text: #0F1A2A; --text-2: #3D4A5C; --text-3: #5A6678; --text-inverse: #FFFFFF;
  --border: #D9DFE7; --border-strong: #7B8798;
  --primary: #1D4ED8; --primary-hover: #1E40AF; --primary-subtle: #E3EBFD; --link: #1D4ED8; --focus: #1D4ED8;
  --success-subtle: #DDF5EA; --success-text: #05603F;
  --danger: #B91C1C; --danger-subtle: #FDE7E7; --danger-text: #991B1B;
  --warning-subtle: #FEF0D2; --warning-text: #8A3B05;
  --info-subtle: #E3EBFD; --info-text: #1E40AF;
  --income: #047857; --expense: #B91C1C; --unpaid: #B45309;
  --wash: #0369A1; --wash-subtle: #E0F0FA; --polish: #6D28D9; --polish-subtle: #EFE7FD;
  --elev-1: 0 1px 2px rgb(15 26 42 / .06), 0 1px 3px rgb(15 26 42 / .08); --elev-2: 0 4px 12px rgb(15 26 42 / .12); --elev-3: 0 12px 32px rgb(15 26 42 / .2);
}
@media (min-width: 600px) { :root { --gutter: 24px; } }
@media (min-width: 1024px) { :root { --gutter: 32px; } }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.6; margin: 0; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 24px; line-height: 32px; font-weight: 700; text-wrap: balance; }
h2 { font-size: 20px; line-height: 28px; font-weight: 600; }
h3 { font-size: 18px; line-height: 28px; font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.caption { font-size: 14px; line-height: 22px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.lg { width: 24px; height: 24px; }
svg.i.sm { width: 16px; height: 16px; }

/* Shell */
.statusbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--env); color: #FFFFFF; font-size: 14px; font-weight: 600; text-align: center; padding: 6px var(--gutter); }
.skip { position: absolute; left: 8px; top: -60px; background: var(--primary); color: var(--on-primary); padding: 8px 16px; border-radius: var(--r-md); z-index: 70; }
.skip:focus { top: 44px; }
.layout { display: block; }
main { padding-inline: var(--gutter); padding-block: 20px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)); max-width: 720px; margin-inline: auto; display: grid; gap: 16px; min-width: 0; }
main.has-actionbar { padding-bottom: calc(var(--nav-h) + 120px + env(safe-area-inset-bottom, 0px)); }
.sidenav { display: none; }
.bottomnav { position: fixed; inset: auto 0 0 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--border); box-shadow: var(--elev-2); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bottomnav ul { list-style: none; margin: 0; padding: 0 4px; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); max-width: 720px; margin-inline: auto; }
.navlink { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 100%; min-height: 44px; text-decoration: none; color: var(--text-2); font-size: 14px; font-weight: 500; position: relative; border-radius: var(--r-md); }
.navlink .pill { display: grid; place-items: center; width: 52px; height: 28px; border-radius: 999px; transition: background var(--dur-fast); }
.navlink[aria-current="page"] { color: var(--link); }
.navlink[aria-current="page"] .pill { background: var(--primary-subtle); }
.navlink.add .fab { width: 48px; height: 48px; border-radius: 999px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; margin-top: -18px; box-shadow: var(--elev-2); }
.navlink.add .fab svg { width: 24px; height: 24px; }
.navbadge { position: absolute; top: 2px; right: calc(50% - 26px); min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--warning); color: #FFFFFF; font-size: 13px; font-weight: 700; line-height: 20px; text-align: center; }

@media (min-width: 1024px) {
  .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); }
  .bottomnav { display: none; }
  .sidenav { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 34px; height: calc(100vh - 34px); padding: 20px 16px; background: var(--surface); border-right: 1px solid var(--border); }
  .sidenav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .sidenav .navlink { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 12px; height: 48px; font-size: 16px; }
  .sidenav .navlink[aria-current="page"] { background: var(--primary-subtle); }
  .sidenav .navlink .pill { width: auto; height: auto; background: none !important; }
  .sidenav .navbadge { position: static; margin-left: auto; }
  .sidenav .foot { margin-top: auto; display: grid; gap: 8px; border-top: 1px solid var(--border); padding-top: 16px; }
  main, main.has-actionbar { max-width: 1200px; padding-bottom: 48px; width: 100%; }
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }

/* Components */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 12px; min-width: 0; box-shadow: var(--elev-1); }
@media (min-width: 600px) { .card { padding: 20px; } }
.card.warning { background: var(--warning-subtle); border-color: var(--warning); }
.card-link { text-decoration: none; color: inherit; }
.card-link:hover .card { border-color: var(--border-strong); }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: var(--r-md); border: 1px solid transparent; font-weight: 600; font-size: 16px; cursor: pointer; text-decoration: none; transition: background var(--dur-fast), border-color var(--dur-fast), transform 80ms; }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn.lg { min-height: 56px; font-size: 18px; }
.btn.full { width: 100%; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.success { background: var(--success); color: #FFFFFF; }
.btn.danger { background: var(--danger); color: #FFFFFF; }
.btn.secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn.ghost { background: transparent; color: var(--link); padding-inline: 12px; }
.btn.danger-ghost { background: transparent; color: var(--danger-text); padding-inline: 12px; }
@media (hover: hover) and (pointer: fine) {
  .btn.primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn.secondary:hover:not(:disabled), .btn.ghost:hover:not(:disabled), .btn.danger-ghost:hover:not(:disabled) { background: var(--surface-2); }
}
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.iconbtn { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: var(--r-md); border: 0; background: transparent; color: var(--text-2); cursor: pointer; }
.iconbtn:hover { background: var(--surface-2); }
.spin { width: 20px; height: 20px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: var(--r-sm); font-size: 14px; font-weight: 500; line-height: 1; white-space: nowrap; }
.badge.wash { background: var(--wash-subtle); color: var(--wash); }
.badge.polish { background: var(--polish-subtle); color: var(--polish); }
.badge.warning { background: var(--warning-subtle); color: var(--warning-text); }
.badge.danger { background: var(--danger-subtle); color: var(--danger-text); }
.badge.success { background: var(--success-subtle); color: var(--success-text); }
.badge.info { background: var(--info-subtle); color: var(--info-text); }
.badge.neutral { background: var(--surface-2); color: var(--text-2); }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--r-md); border: 1px solid; }
.banner.warning { background: var(--warning-subtle); color: var(--warning-text); border-color: var(--warning); }
.banner.danger { background: var(--danger-subtle); color: var(--danger-text); border-color: var(--danger); }
.banner.info { background: var(--info-subtle); color: var(--info-text); border-color: var(--info-text); }
.banner.success { background: var(--success-subtle); color: var(--success-text); border-color: var(--success); }
.banner p { color: var(--text); }
.banner a { color: inherit; font-weight: 600; }

.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: var(--r-md); padding: 4px; gap: 4px; }
.seg button { min-height: 44px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; color: var(--text-2); font-weight: 600; cursor: pointer; }
.seg button[aria-selected="true"], .seg button[aria-checked="true"] { background: var(--surface); color: var(--text); box-shadow: var(--elev-1); outline: 1px solid var(--border); }
.seg.wide { display: grid; width: 100%; }

.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .label { font-weight: 500; color: var(--text); }
.req { color: var(--danger-text); }
.hint { font-size: 14px; color: var(--text-3); }
.err { font-size: 14px; color: var(--danger-text); display: flex; gap: 6px; align-items: center; }
.input { width: 100%; min-height: 48px; padding: 0 16px; border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--surface); font-size: 18px; }
.input:focus { outline: none; border: 2px solid var(--primary); box-shadow: 0 0 0 3px var(--primary-subtle); }
.input[aria-invalid="true"] { border: 2px solid var(--danger-text); }
.input:disabled { background: var(--surface-2); opacity: .7; }
.input.plate { min-height: 64px; text-align: center; font-size: 24px; font-weight: 700; text-transform: uppercase; }
.money { position: relative; }
.money span { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 22px; color: var(--text-3); font-weight: 600; }
.money .input { min-height: 64px; text-align: right; font-size: 28px; font-weight: 700; padding-left: 44px; }
.money.expense .input { color: var(--expense); }

.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.choices.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.chip { min-height: 44px; padding: 0 14px; border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.chip.tile { min-height: 72px; flex-direction: column; gap: 2px; padding: 8px; }
.chip.tile small { font-size: 14px; color: var(--text-3); font-weight: 400; }
.chip .tick { display: none; }
.chip[aria-checked="true"] { border-width: 2px; background: var(--primary-subtle); border-color: var(--primary); color: var(--link); font-weight: 600; }
.chip[aria-checked="true"] .tick { display: inline-block; }
.chip.t-wash[aria-checked="true"] { background: var(--wash-subtle); border-color: var(--wash); color: var(--wash); }
.chip.t-polish[aria-checked="true"] { background: var(--polish-subtle); border-color: var(--polish); color: var(--polish); }
.chip.t-success[aria-checked="true"] { background: var(--success-subtle); border-color: var(--success); color: var(--success-text); }
.chip.t-warning[aria-checked="true"] { background: var(--warning-subtle); border-color: var(--warning); color: var(--warning-text); }
.chip.t-danger[aria-checked="true"] { background: var(--danger-subtle); border-color: var(--danger); color: var(--danger-text); }
@media (hover: hover) and (pointer: fine) { .chip:hover { background: var(--surface-2); } }

/* Domain */
.hero .big { font-size: 40px; line-height: 48px; font-weight: 700; }
@media (min-width: 1024px) { .hero .big { font-size: 48px; line-height: 56px; } }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
@media (min-width: 600px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat .v { font-size: 20px; font-weight: 700; line-height: 28px; }
.stat .l { font-size: 14px; color: var(--text-2); font-weight: 500; }
.trend { display: inline-flex; align-items: center; gap: 2px; font-size: 14px; font-weight: 600; }
.trend.up { color: var(--success-text); } .trend.down { color: var(--danger-text); }

.rows { display: grid; gap: 8px; }
.rec { width: 100%; text-align: left; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px 12px 16px; border-radius: var(--r-lg); border: 1px solid var(--border); background: var(--surface); cursor: pointer; position: relative; overflow: hidden; }
.rec::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--wash); }
.rec.polish::before { background: var(--polish); } .rec.expense::before { background: var(--expense); }
.rec:hover { border-color: var(--border-strong); }
.rec .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--wash-subtle); color: var(--wash); }
.rec.polish .ic { background: var(--polish-subtle); color: var(--polish); }
.rec.expense .ic { background: var(--danger-subtle); color: var(--expense); }
.rec .t1 { font-weight: 600; font-size: 18px; line-height: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec .t1 small { font-weight: 400; font-size: 14px; color: var(--text-2); margin-left: 6px; }
.rec .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.rec .note { font-size: 14px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.rec .amt { text-align: right; font-weight: 700; font-size: 18px; }
.rec .amt.unpaid { color: var(--unpaid); } .rec .amt.expense { color: var(--expense); }
.rec .amt small { display: block; font-weight: 400; font-size: 14px; color: var(--text-3); }
.rec.is-new { animation: newrow 2s var(--ease); }
@keyframes newrow { 0%, 40% { background: var(--primary-subtle); } 100% { background: var(--surface); } }

.dash { display: grid; gap: 16px; }
@media (min-width: 1024px) { .dash { grid-template-columns: 7fr 5fr; align-items: start; } .dash > .col { display: grid; gap: 16px; min-width: 0; } }
.dash > .col { display: grid; gap: 16px; min-width: 0; }
.pagehead { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.weather { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer; font-weight: 500; }

.chart svg { width: 100%; height: auto; display: block; }
.chart .gridline { stroke: var(--border); stroke-width: 1; }
.chart .axis { fill: var(--text-3); font-size: 11px; font-family: var(--font); }
.chart .inc { fill: var(--income); } .chart .exp { fill: var(--expense); }
.legend { display: flex; gap: 16px; font-size: 14px; color: var(--text-2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
details summary { cursor: pointer; color: var(--link); font-weight: 600; min-height: 44px; display: flex; align-items: center; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 10px 8px; border-bottom: 1px solid var(--border); text-align: left; }
th { color: var(--text-2); font-weight: 600; }
td.r, th.r { text-align: right; }

.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--primary); }
.cust { display: grid; gap: 6px; padding-block: 8px; border-bottom: 1px solid var(--border); }
.cust:last-child { border-bottom: 0; }

.debtgrid { display: grid; gap: 16px; }
@media (min-width: 1024px) { .debtgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }
.debtitem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 10px 12px; border: 0; background: transparent; width: 100%; text-align: left; cursor: pointer; border-top: 1px solid var(--border); min-height: 52px; }
.debtitem:first-child { border-top: 0; }
.debtitem:hover { background: var(--surface-2); }
.debtlist { background: var(--surface-2); border-radius: var(--r-md); overflow: hidden; }
.debtlist .debtitem:hover { background: var(--bg); }

.formgrid { display: grid; gap: 20px; }
@media (min-width: 1024px) { .formgrid { grid-template-columns: 1fr 1fr; align-items: start; } .formgrid > .col { display: grid; gap: 20px; } }
.formgrid > .col { display: grid; gap: 20px; min-width: 0; }
.actionbar { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--surface); border-top: 1px solid var(--border); box-shadow: var(--elev-2); padding: 10px var(--gutter); }
.actionbar .inner { max-width: 720px; margin-inline: auto; display: grid; gap: 8px; }
.actionbar .btns { display: grid; grid-template-columns: 2fr 3fr; gap: 10px; }
@media (min-width: 1024px) { .actionbar { position: static; box-shadow: none; border: 0; padding: 0; background: transparent; } .actionbar .inner { max-width: none; } }

.tokens { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.sw { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }

/* Dialog & toast */
dialog { border: 0; padding: 0; background: var(--surface); color: var(--text); border-radius: var(--r-xl); width: min(480px, calc(100vw - 32px)); max-height: 90dvh; box-shadow: var(--elev-3); }
dialog::backdrop { background: var(--overlay); }
dialog[open] { animation: dlg var(--dur-base) var(--ease); }
@keyframes dlg { from { opacity: 0; transform: scale(.98); } }
@media (max-width: 599px) {
  dialog.sheet { margin: auto 0 0 0; width: 100vw; max-width: 100vw; border-radius: var(--r-xl) var(--r-xl) 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  dialog.sheet[open] { animation: sheet var(--dur-base) var(--ease); }
}
@keyframes sheet { from { transform: translateY(40px); opacity: 0; } }
.dlg-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 18px 20px 10px; }
.dlg-b { padding: 4px 20px 16px; display: grid; gap: 16px; overflow-y: auto; }
.dlg-f { display: flex; gap: 10px; justify-content: flex-end; padding: 12px 20px 20px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.dlg-f .spacer { flex: 1; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 16px; }
.kv dt { color: var(--text-2); } .kv dd { margin: 0; font-weight: 600; text-align: right; }
.toasts { position: fixed; z-index: 60; left: var(--gutter); right: var(--gutter); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; justify-items: center; pointer-events: none; }
main.has-actionbar ~ .toasts, .toasts.raised { bottom: calc(var(--nav-h) + 140px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 1024px) { .toasts, .toasts.raised { left: auto; right: 32px; bottom: 32px; justify-items: end; } }
.toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; max-width: 440px; padding: 12px 12px 12px 16px; border-radius: var(--r-md); background: var(--surface-inverse); color: var(--text-inverse); box-shadow: var(--elev-3); animation: toastin var(--dur-base) var(--ease); }
.toast .iconbtn { color: inherit; width: 36px; height: 36px; }
@keyframes toastin { from { opacity: 0; transform: translateY(8px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0ms !important; transition-duration: 0ms !important; }

          ${f.paid ? `</details>` : ''}

          <div class="field"><label for="f-note">หมายเหตุ</label><input class="input" id="f-note" maxlength="200" placeholder="เช่น ล้างห้องเครื่อง" value="${esc(f.note)}"></div>

      <section class="card"><h2>ปุ่ม</h2><div class="row"><button class="btn primary" type="button">บันทึก</button><button class="btn secondary" type="button">บันทึกแล้วทำต่อ</button><button class="btn success" type="button">${ic('checkc')}เคลียร์ยอด</button><button class="btn danger" type="button">ลบรายการ</button><button class="btn ghost" type="button">ดูทั้งหมด</button><button class="btn primary" type="button" disabled>ปิดใช้งาน</button><button class="btn primary" type="button" aria-busy="true" disabled><span class="spin" aria-hidden="true"></span>กำลังบันทึก…</button></div>
        <p class="caption faint">กด Tab เพื่อดูวงแหวน focus</p></section>
      <section class="card"><h2>Badge และ Banner</h2><div class="row"><span class="badge wash">${ic('wash', 'sm')}ล้างรถ</span><span class="badge polish">${ic('polish', 'sm')}ขัดสี</span><span class="badge success">${ic('check', 'sm')}ชำระแล้ว</span><span class="badge warning">${ic('clock', 'sm')}ค้างชำระ</span><span class="badge danger">${ic('alert', 'sm')}เร่งด่วน</span><span class="badge info">ลูกค้าประจำ · ครั้งที่ 3</span></div>
        <div class="banner info">${ic('info')}<div><strong>กู้ข้อมูลที่กรอกค้างไว้แล้ว</strong></div></div>
        <div class="banner danger">${ic('alert')}<div><strong>บันทึกไม่สำเร็จ</strong><p class="caption">ตรวจอินเทอร์เน็ตแล้วกด ลองอีกครั้ง</p></div></div></section>
      <section class="card"><h2>ช่องกรอก</h2>
        <div class="field"><label for="t1">ปกติ</label><input class="input" id="t1" placeholder="พิมพ์ชื่อ"></div>
        <div class="field"><label for="t2">ไม่ถูกต้อง</label><input class="input" id="t2" aria-invalid="true" aria-describedby="t2e" value=""><p class="err" id="t2e">${ic('alert', 'sm')}กรุณากรอกป้ายทะเบียน</p></div>
        <div class="field"><label for="t3">ปิดใช้งาน</label><input class="input" id="t3" disabled value="ไม่สามารถแก้ไขได้"></div></section>`;
  }

  /* ---------- routing ---------- */
  const SCREENS = { dashboard: screenDashboard, debts: screenDebts, add: screenAdd, history: screenHistory, more: screenMore, tokens: screenTokens };
  let current = null;
  function render(focus) {
    const id = SCREENS[location.hash.slice(1)] ? location.hash.slice(1) : 'dashboard';
    const main = document.getElementById('main');
    main.className = id === 'add' ? 'has-actionbar' : '';
    document.getElementById('toasts').classList.toggle('raised', id === 'add');
    main.innerHTML = SCREENS[id]();
    renderNav(id);
    if (focus && id !== current) { const h = main.querySelector('h1'); if (h) h.focus({ preventScroll: false }); window.scrollTo(0, 0); }
    current = id;
    S.newId = null;
  }
  window.addEventListener('hashchange', () => render(true));

  /* ---------- theme ---------- */
  const mq = window.matchMedia('(prefers-color-scheme: light)');
  function isDark() { const t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : !mq.matches; }
  function setTheme(dark) { document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light'); try { localStorage.setItem('cc-preview-theme', dark ? 'dark' : 'light'); } catch (e) { /* storage unavailable */ } paintThemeBtn(); render(false); }
  function paintThemeBtn() { const b = document.getElementById('theme-side'); b.innerHTML = ic(isDark() ? 'sun' : 'moon') + (isDark() ? 'ธีมสว่าง' : 'ธีมมืด'); }
  try { const t = localStorage.getItem('cc-preview-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* ignore */ }
  document.getElementById('theme-side').addEventListener('click', () => setTheme(!isDark()));

  /* ---------- toast ---------- */
  function toast(msg, tone = 'success') {
    const box = tone === 'error' ? document.getElementById('toasts') : document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast'; if (tone === 'error') el.setAttribute('role', 'alert');
    el.innerHTML = `${ic(tone === 'error' ? 'alert' : tone === 'info' ? 'info' : 'checkc')}<span style="flex:1">${esc(msg)}</span><button class="iconbtn" type="button" aria-label="ปิดข้อความ">${ic('x')}</button>`;
    el.querySelector('button').onclick = () => el.remove();
    box.appendChild(el); while (box.children.length > 3) box.firstChild.remove();
    if (tone !== 'error') { let t = setTimeout(() => el.remove(), 5000); el.addEventListener('mouseenter', () => clearTimeout(t)); el.addEventListener('focusin', () => clearTimeout(t)); }
  }

  /* ---------- dialog ---------- */
  const dlg = document.getElementById('dlg');
  let opener = null;
  function openDialog(html, { sheet = false, focus } = {}) {
    opener = document.activeElement;
    dlg.className = sheet ? 'sheet' : '';
    dlg.setAttribute('role', sheet ? 'dialog' : 'alertdialog');
    dlg.innerHTML = html; dlg.showModal();
    const f = focus ? dlg.querySelector(focus) : dlg.querySelector('[data-autofocus]');
    if (f) f.focus();
  }
  function closeDialog() { if (dlg.open) dlg.close(); }
  dlg.addEventListener('close', () => { if (opener && document.contains(opener)) opener.focus(); });
  dlg.addEventListener('click', (e) => { if (e.target === dlg && dlg.className === 'sheet') closeDialog(); if (e.target.closest('[data-close]')) closeDialog(); });
  const confirmHTML = (title, body, actions) => `<div class="dlg-h"><h2 id="dlg-title">${title}</h2></div><div class="dlg-b">${body}</div><div class="dlg-f">${actions}</div>`;

  function findRec(id) { return [...S.records, ...S.older].find(x => x.id === id) || S.expenses.find(x => x.id === id); }
  function openEdit(id) {
    const x = findRec(id); if (!x) { toast('ไม่พบรายการนี้ อาจถูกลบไปแล้ว', 'error'); return; }
    const isExp = x.kind === 'expense';
    const orig = isExp ? String(x.amount) : x.price + '|' + x.paid;
    openDialog(`<div class="dlg-h"><div><h2 id="dlg-title">${isExp ? 'แก้ไขรายจ่าย' : 'แก้ไขรายรับ'}</h2><p class="caption muted">${esc(isExp ? x.title : x.plate)} · ${x.date || '14 ต.ค.'} 2569 · ${x.time} น.</p></div><button class="iconbtn" type="button" data-close aria-label="ปิด">${ic('x')}</button></div>
      <div class="dlg-b">
        ${isExp ? `<div class="field"><label for="e-amt">จำนวนเงิน (บาท)</label><div class="money expense"><span aria-hidden="true">฿</span><input class="input num" id="e-amt" inputmode="numeric" value="${x.amount}"></div></div>` :
        `<div class="field"><label for="e-plate">ป้ายทะเบียน</label><input class="input plate" id="e-plate" value="${esc(x.plate)}" disabled></div>
         <div class="field"><label for="e-price">ราคา (บาท)</label><div class="money"><span aria-hidden="true">฿</span><input class="input num" id="e-price" inputmode="numeric" value="${x.price}"></div><p class="err" id="e-err" hidden>${ic('alert', 'sm')}กรุณากรอกราคา</p></div>
         <div class="field"><span class="label" id="lbl-epaid">สถานะการชำระ</span><div class="choices" role="radiogroup" aria-labelledby="lbl-epaid"><button type="button" role="radio" class="chip t-success" aria-checked="${x.paid}" data-epaid="1"><span class="tick">${ic('check', 'sm')}</span>ชำระแล้ว</button><button type="button" role="radio" class="chip t-warning" aria-checked="${!x.paid}" data-epaid="0"><span class="tick">${ic('check', 'sm')}</span>ค้างชำระ</button></div></div>`}
        <dl class="kv caption"><dt>เพิ่มโดย</dt><dd>staff@example.com</dd><dt>แก้ไขล่าสุดโดย</dt><dd>—</dd></dl>
        <p class="caption faint">หน้าแก้ไขจริงมีทุกช่องเหมือนหน้าบันทึก (ตัวอย่างนี้แสดงบางส่วน)</p>
      </div>
      <div class="dlg-f" id="e-foot"><button class="btn danger-ghost" type="button" id="e-del">ลบ</button><span class="spacer"></span><button class="btn primary" type="button" id="e-save" disabled>บันทึกการแก้ไข</button></div>`, { sheet: true, focus: '#dlg-title' });
    const title = dlg.querySelector('#dlg-title'); title.tabIndex = -1; title.focus();
    let paid = x.paid;
    const cur = () => isExp ? dlg.querySelector('#e-amt').value : dlg.querySelector('#e-price').value + '|' + paid;
    const sync = () => { dlg.querySelector('#e-save').disabled = cur() === orig; };
    dlg.querySelectorAll('input').forEach(i => i.addEventListener('input', () => { i.value = i.value.replace(/\D/g, ''); sync(); }));
    dlg.querySelectorAll('[data-epaid]').forEach(b => b.onclick = () => { paid = b.dataset.epaid === '1'; dlg.querySelectorAll('[data-epaid]').forEach(o => o.setAttribute('aria-checked', o === b)); sync(); });
    dlg.querySelector('#e-save').onclick = () => {
      const v = (isExp ? dlg.querySelector('#e-amt') : dlg.querySelector('#e-price')).value;
      if (!v) { const er = dlg.querySelector('#e-err'); if (er) { er.hidden = false; dlg.querySelector('#e-price').setAttribute('aria-invalid', 'true'); dlg.querySelector('#e-price').focus(); } return; }
      if (isExp) x.amount = +v; else { x.price = +v; x.paid = paid; }
      closeDialog(); render(false); toast(`บันทึกการแก้ไข ${isExp ? x.title : x.plate} แล้ว`);
    };
    dlg.querySelector('#e-del').onclick = () => {
      const foot = dlg.querySelector('#e-foot');
      foot.innerHTML = `<p style="flex-basis:100%;font-weight:600">ลบ ${esc(isExp ? x.title : x.plate)} ${baht(isExp ? x.amount : x.price)} ใช่ไหม?</p><span class="spacer"></span><button class="btn secondary" type="button" id="d-no">ยกเลิก</button><button class="btn danger" type="button" id="d-yes">ลบรายการ</button>`;
      foot.querySelector('#d-no').focus();
      foot.querySelector('#d-no').onclick = () => { closeDialog(); openEdit(id); };
      foot.querySelector('#d-yes').onclick = () => {
        S.records = S.records.filter(r => r.id !== id); S.older = S.older.filter(r => r.id !== id); S.expenses = S.expenses.filter(r => r.id !== id);
        closeDialog(); render(false); toast(`ลบ ${isExp ? x.title : x.plate} แล้ว (ตัวอย่างเท่านั้น)`);
      };
    };
  }

  function openSettle(name) {
    const g = groups().find(x => x.name === name); if (!g) { toast('ไม่มียอดค้างชำระของลูกค้านี้', 'info'); return; }
    const plates = g.items.slice(0, 6).map(i => esc(i.plate)).join(', ') + (g.items.length > 6 ? ` และอีก ${g.items.length - 6} คัน` : '');
    openDialog(confirmHTML(`เคลียร์ยอด ${esc(name)}?`,
      `<dl class="kv"><dt>จำนวน</dt><dd class="num">${g.items.length} คัน</dd><dt>ยอดรวม</dt><dd class="num" style="color:var(--unpaid)">${baht(g.total)}</dd></dl><p class="caption muted">${plates}</p><p>ทุกรายการจะเปลี่ยนเป็น <strong>ชำระแล้ว</strong></p>`,
      `<button class="btn secondary" type="button" data-close data-autofocus>ยกเลิก</button><button class="btn success" type="button" id="s-yes">${ic('checkc')}เคลียร์ยอด</button>`));
    dlg.querySelector('#s-yes').onclick = (ev) => {
      const b = ev.currentTarget; b.disabled = true; b.setAttribute('aria-busy', 'true'); b.innerHTML = '<span class="spin" aria-hidden="true"></span>กำลังเคลียร์ยอด…';
      setTimeout(() => { g.items.forEach(i => { i.paid = true; }); closeDialog(); render(false); toast(`เคลียร์ยอด ${name} ${baht(g.total)} แล้ว`); }, 700);
    };
  }

  /* ---------- add form logic ---------- */
  function readForm() {
    const f = S.form, v = id => { const el = document.getElementById(id); return el ? el.value : null; };
    if (v('f-plate') !== null) f.plate = v('f-plate');
    if (v('f-price') !== null) f.price = v('f-price').replace(/\D/g, '');
    if (v('f-cust') !== null) f.customer = v('f-cust');
    if (v('f-note') !== null) f.note = v('f-note');
    if (v('f-amount') !== null) f.amount = v('f-amount').replace(/\D/g, '');
    if (v('f-title') !== null) f.title = v('f-title');
  }
  function validate() {
    const f = S.form, e = {};
    if (f.kind === 'income') { if (!f.plate.trim()) e.plate = 'กรุณากรอกป้ายทะเบียน'; if (!f.type) e.type = 'กรุณาเลือกประเภทรถ'; if (f.price === '') e.price = 'กรุณากรอกราคา'; }
    else { if (!f.amount || +f.amount < 1) e.amount = 'กรุณากรอกจำนวนเงินมากกว่า 0'; if (!f.title.trim()) e.title = 'กรุณาระบุรายการจ่าย'; }
    f.errors = e; return Object.keys(e).length === 0;
  }
  function save(mode, skipNameCheck) {
    readForm(); S.form.submitted = true;
    if (!validate()) { render(false); const s = document.getElementById('errsum'); if (s) s.focus(); return; }
    const f = S.form;
    if (f.kind === 'income' && !f.paid && !f.customer.trim() && !skipNameCheck) {
      openDialog(confirmHTML('ยังไม่ได้ใส่ชื่อลูกค้า', `<p>รายการค้างชำระที่ไม่มีชื่อจะไปอยู่ในกลุ่ม "ลูกค้าทั่วไป" และติดตามได้ยาก</p>`,
        `<button class="btn secondary" type="button" id="n-skip">บันทึกโดยไม่ใส่ชื่อ</button><button class="btn primary" type="button" id="n-add" data-autofocus>ใส่ชื่อลูกค้า</button>`));
      dlg.querySelector('#n-add').onclick = () => { closeDialog(); const c = document.getElementById('f-cust'); if (c) c.focus(); };
      dlg.querySelector('#n-skip').onclick = () => { closeDialog(); save(mode, true); };
      return;
    }
    document.querySelectorAll('[data-save]').forEach(b => { b.disabled = true; b.setAttribute('aria-busy', 'true'); });
    const btn = document.querySelector(`[data-save="${mode}"]`); btn.innerHTML = '<span class="spin" aria-hidden="true"></span>กำลังบันทึก…';
    setTimeout(() => {
      let msg;
      if (f.kind === 'income') {
        const r = rec({ seq: S.records.length + 1, time: '09:4' + (S.records.length % 10), plate: f.plate.trim().toUpperCase(), job: f.job, type: f.type, brand: f.brand || '—', price: +f.price, paid: f.paid, customer: f.customer.trim(), note: f.note.trim(), date: f.backdated ? '13 ต.ค.' : '14 ต.ค.' });
        if (!f.backdated) S.records.push(r); S.newId = r.id;
        if (r.customer && !S.recent.includes(r.customer)) S.recent.unshift(r.customer);
        msg = `บันทึก ${r.plate} ${baht(r.price)} แล้ว`;
        if (mode === 'bulk') { Object.assign(f, { plate: '', price: '', customer: '', note: '', errors: {}, submitted: false }); }
      } else {
        S.expenses.push({ id: 'e' + (++seq), kind: 'expense', time: '09:45', title: f.title.trim(), note: f.note.trim(), amount: +f.amount });
        msg = `บันทึกรายจ่าย ${f.title.trim()} ${baht(+f.amount)} แล้ว`;
        if (mode === 'bulk') Object.assign(f, { amount: '', title: '', note: '', errors: {}, submitted: false });
      }
      if (mode === 'one') { S.form = blankForm(f.kind); location.hash = '#dashboard'; toast(msg); return; }
      render(false); toast(msg + ' · พร้อมบันทึกคันถัดไป');
      const first = document.getElementById(f.kind === 'income' ? 'f-plate' : 'f-amount'); if (first) first.focus();
      S.newId = null;
    }, 600);
  }

  /* ---------- events (delegated) ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, a'); if (!t) return;
    if (t.dataset.edit) return openEdit(t.dataset.edit);
    if (t.dataset.settle) return openSettle(t.dataset.settle);
    if (t.dataset.bill) return toast(`ตัวอย่าง: แอปจริงจะสร้างบิล PDF ของ ${t.dataset.bill}`, 'info');
    if (t.dataset.seg) { const v = t.dataset.v; if (t.dataset.seg === 'chart') S.chartMode = +v; if (t.dataset.seg === 'cust') S.custPeriod = v; if (t.dataset.seg === 'debtsort') S.debtSort = v; render(false); const again = document.querySelector(`[data-seg="${t.dataset.seg}"][data-v="${v}"]`); if (again) again.focus(); return; }
    if (t.dataset.kind) { readForm(); S.form = Object.assign(blankForm(t.dataset.kind), { backdated: S.form.backdated }); render(false); document.querySelector(`[data-kind="${t.dataset.kind}"]`).focus(); return; }
    if (t.dataset.back !== undefined) { readForm(); S.form.backdated = t.dataset.back === '1'; render(false); return; }
    if (t.dataset.chip) {
      readForm(); const f = S.form, k = t.dataset.chip, v = t.dataset.v;
      if (k === 'job') f.job = v;
      if (k === 'type') f.type = f.type === v ? '' : v;
      if (k === 'brand') f.brand = f.brand === v ? '' : v;
      if (k === 'paid') f.paid = v === '1';
      if (k === 'customer') f.customer = f.customer === v ? '' : v;
      if (k === 'title') f.title = f.title === v ? '' : v;
      if (f.submitted) validate();
      const openDetails = [...document.querySelectorAll('details[open] summary')].map(s => s.textContent.split(' ·')[0]);
      render(false);
      document.querySelectorAll('details summary').forEach(s => { if (openDetails.includes(s.textContent.split(' ·')[0])) s.parentElement.open = true; });
      const again = document.querySelector(`[data-chip="${k}"][data-v="${CSS.escape(v)}"]`); if (again) again.focus();
      return;
    }
    if (t.dataset.save) return save(t.dataset.save);
    if (t.id === 'refresh') return toast('อัปเดตข้อมูลแล้ว', 'info');
    if (t.id === 'wx') return openDialog(`<div class="dlg-h"><h2 id="dlg-title">สภาพอากาศ · ตัวอย่าง</h2><button class="iconbtn" type="button" data-close aria-label="ปิด">${ic('x')}</button></div><div class="dlg-b"><p class="row">${ic('rain', 'lg')}<span style="font-size:24px;font-weight:700">31°C</span><span class="muted">มีเมฆ ฝนบางพื้นที่</span></p><dl class="kv"><dt>รู้สึกเหมือน</dt><dd>35°C</dd><dt>ความชื้น</dt><dd>72%</dd><dt>ลม</dt><dd>9 km/h</dd><dt>โอกาสฝนวันนี้</dt><dd>65%</dd><dt>ฝุ่น (AQI)</dt><dd>48 · ดี</dd></dl><p class="caption faint">อัปเดต 09:41</p></div>`, { sheet: true });
    if (t.id === 'export') return toast('ตัวอย่าง: แอปจริงจะเปิดหน้าต่างส่งออก Excel', 'info');
    if (t.id === 'h-exp') return toast('ตัวอย่างนี้แสดงเฉพาะแท็บรายรับ', 'info');
    if (t.id === 'sw-theme') return setTheme(!isDark());
    if (t.id === 'logout') {
      openDialog(confirmHTML('ออกจากระบบ?', '<p>บัญชี owner@example.com</p><p class="caption muted">ข้อมูลที่กรอกค้างในเครื่องนี้จะถูกล้าง</p>', '<button class="btn secondary" type="button" data-close data-autofocus>ยกเลิก</button><button class="btn danger" type="button" id="lo-yes">ออกจากระบบ</button>'));
      dlg.querySelector('#lo-yes').onclick = () => { closeDialog(); toast('ตัวอย่าง: ไม่ได้ออกจากระบบจริง', 'info'); };
    }
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'f-price' || t.id === 'f-amount') { t.value = t.value.replace(/\D/g, ''); }
    if (t.id === 'f-plate') { const pos = t.selectionStart; t.value = t.value.toUpperCase(); t.setSelectionRange(pos, pos); document.getElementById('plate-hint').innerHTML = plateHint(t.value); }
  });

  paintThemeBtn();
  render(false);
})();
</script>
